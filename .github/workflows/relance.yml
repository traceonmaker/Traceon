name: Relance horaire

# Appelle l'endpoint de relance TraceOn toutes les heures (gratuit, via GitHub Actions).
# Complète le cron Vercel quotidien — la relance est idempotente (flag relance_envoyee).
on:
  schedule:
    - cron: '0 * * * *'      # toutes les heures, à la minute 0
  workflow_dispatch: {}        # bouton "Run workflow" pour tester à la main

jobs:
  relance:
    runs-on: ubuntu-latest
    steps:
      - name: Déclencher la relance
        run: |
          curl -sS -X GET "https://traceon-eosin.vercel.app/api/cron/relance" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            -w "\nHTTP %{http_code}\n"
